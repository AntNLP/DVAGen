model:
  language_model_path: "/home/nwliu/public/pretrain/Qwen/Qwen3-0.6B-Base"
  phrase_encoder_path: "/home/nwliu/public/pretrain/Qwen/Qwen3-0.6B-Base"
  use_phrase_encoder_proj: true
  phrase_encoder_proj_pdrop: 0.1
  phrase_encoder_proj_act: "relu"
  phrase_encoder_batch_size: 64

data:
  train_file: "/home/nwliu/data/dvagen/data/wikitext-103/base_data_128.txt"
  validation_file: "/home/weidu/DVAGen/tests/data/50.txt"

train:
  finetuning_type: "full"
  output_dir: "/home/nwliu/data/dvagen/ckpt/qwen3-0.6b_qwen3-0.6b"
  learning_rate: 1e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 10
  logging_steps: 1
  max_steps: 20000
  save_steps: 5000
  save_total_limit: 5
  bf16: true
  tf32: true
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 2
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  ddp_find_unused_parameters: true
  deepspeed: "/home/nwliu/DVAGen/examples/train/zero1.json"
  report_to: "wandb"
